<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF4EA" />
  <meta name="description" content="소중한 사람에게 전하는 일기를 모아 보는 개인 일기장" />
  <title>당신을 위한 여름과 마음 모음</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <style>
    :root {
      --paper: #faf4ea;
      --card: #fffdf8;
      --ink: #3f352d;
      --muted: #75695d;
      --line: rgba(63, 53, 45, 0.16);
      --accent: #b9874f;
      --accent-soft: rgba(185, 135, 79, 0.14);
      color-scheme: light;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 20% 0%, rgba(231, 155, 87, 0.16), transparent 34rem),
        radial-gradient(circle at 80% 8%, rgba(167, 203, 212, 0.18), transparent 30rem),
        var(--paper);
      color: var(--ink);
    }

    button, input, textarea {
      font: inherit;
    }

    .shell {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: 32px 18px 56px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 5vw, 2.6rem);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      min-height: 40px;
      padding: 0 13px;
      cursor: pointer;
    }

    .btn.primary {
      border-color: rgba(185, 135, 79, 0.45);
      background: var(--accent-soft);
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: rgba(255, 253, 248, 0.82);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(60, 45, 30, 0.08);
    }

    .list {
      padding: 10px;
      max-height: calc(100dvh - 150px);
      overflow: auto;
    }

    .entry-button {
      width: 100%;
      display: grid;
      gap: 3px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      padding: 11px 10px;
      cursor: pointer;
    }

    .entry-button:hover,
    .entry-button.active {
      background: var(--accent-soft);
    }

    .entry-date {
      font-weight: 800;
    }

    .entry-title {
      color: var(--muted);
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }

    .reader {
      min-height: 520px;
      padding: clamp(18px, 4vw, 34px);
    }

    .reader h2 {
      margin: 0 0 8px;
      font-size: clamp(1.45rem, 4vw, 2.1rem);
      line-height: 1.3;
    }

    .reader-meta {
      color: var(--muted);
      margin-bottom: 24px;
    }

    .body {
      white-space: pre-wrap;
      line-height: 1.9;
      font-size: 1.05rem;
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--muted);
      line-height: 1.7;
    }

    dialog {
      width: min(92vw, 640px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      padding: 0;
      box-shadow: 0 24px 80px rgba(40, 32, 24, 0.32);
    }

    dialog::backdrop {
      background: rgba(40, 32, 24, 0.36);
    }

    .writer {
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .writer-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .writer h2 {
      margin: 0;
      font-size: 1.35rem;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      padding: 11px 12px;
    }

    textarea {
      min-height: 260px;
      resize: vertical;
      line-height: 1.8;
    }

    .writer-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      min-height: 1.5em;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }
      .toolbar {
        justify-content: flex-start;
      }
      .layout {
        grid-template-columns: 1fr;
      }
      .list {
        max-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>당신을 위한 여름과 마음 모음</h1>
        <p class="subtitle">날짜를 고르면 저장된 일기를 바로 읽을 수 있습니다.</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="reloadBtn" type="button">새로고침</button>
        <button class="btn primary" id="openWriterBtn" type="button">일기 쓰기</button>
      </div>
    </header>

    <section class="layout">
      <nav class="panel list" id="entryList" aria-label="일기 목록"></nav>
      <article class="panel reader" id="reader" aria-live="polite">
        <p class="empty">일기 목록을 불러오는 중입니다.</p>
      </article>
    </section>
  </main>

  <dialog id="writerDialog">
    <form class="writer" method="dialog" id="writerForm">
      <div class="writer-head">
        <h2>일기 쓰기</h2>
        <button class="btn" value="cancel" type="submit">닫기</button>
      </div>
      <label>
        날짜
        <input id="writerDate" type="date" required />
      </label>
      <label>
        제목
        <input id="writerTitle" type="text" maxlength="120" placeholder="비워두면 날짜가 제목이 됩니다." />
      </label>
      <label>
        본문
        <textarea id="writerBody" placeholder="오늘의 일기를 적어 주세요."></textarea>
      </label>
      <label>
        Worker API URL
        <input id="writerApiUrl" type="url" placeholder="https://your-worker.example.workers.dev/api/diary" />
      </label>
      <label>
        쓰기 토큰
        <input id="writerToken" type="password" placeholder="Worker WRITE_TOKEN" autocomplete="off" />
      </label>
      <div class="writer-actions">
        <button class="btn" id="saveDraftBtn" type="button">임시 저장</button>
        <button class="btn" id="downloadTxtBtn" type="button">txt 다운로드</button>
        <button class="btn primary" id="uploadBtn" type="button">업로드</button>
      </div>
      <div class="status" id="writerStatus" role="status"></div>
    </form>
  </dialog>

  <script>
    const CONFIG = {
      indexUrl: 'Diary_formyWife/data/diary-index.json',
      dataRoot: 'Diary_formyWife/'
    };

    const $ = (selector) => document.querySelector(selector);
    const state = {
      index: {},
      selectedKey: ''
    };

    function todayKey() {
      const now = new Date();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${now.getFullYear()}-${month}-${day}`;
    }

    function resolveDataUrl(url) {
      if (/^https?:\/\//.test(url)) return url;
      return CONFIG.dataRoot + url.replace(/^\/+/, '');
    }

    function formatDate(key) {
      const [year, month, day] = key.split('-').map(Number);
      return `${year}년 ${month}월 ${day}일`;
    }

    async function loadIndex() {
      const list = $('#entryList');
      const reader = $('#reader');
      list.innerHTML = '';
      reader.innerHTML = '<p class="empty">일기 목록을 불러오는 중입니다.</p>';

      try {
        const response = await fetch(CONFIG.indexUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`index ${response.status}`);
        state.index = await response.json();
      } catch (error) {
        console.warn(error);
        reader.innerHTML = '<p class="empty">일기 목록을 불러오지 못했습니다. 배포된 data/diary-index.json 파일을 확인해 주세요.</p>';
        return;
      }

      renderList();
      const keys = Object.keys(state.index).sort();
      if (keys.length) {
        await openEntry(keys[keys.length - 1]);
      } else {
        reader.innerHTML = '<p class="empty">아직 등록된 일기가 없습니다.</p>';
      }
    }

    function renderList() {
      const list = $('#entryList');
      const keys = Object.keys(state.index).sort().reverse();
      list.innerHTML = '';

      for (const key of keys) {
        const item = state.index[key];
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'entry-button';
        button.dataset.key = key;
        button.innerHTML = `
          <span class="entry-date">${formatDate(key)}</span>
          <span class="entry-title">${escapeHtml(item.title || formatDate(key))}</span>
        `;
        button.addEventListener('click', () => openEntry(key));
        list.appendChild(button);
      }
    }

    async function openEntry(key) {
      const item = state.index[key];
      if (!item) return;

      state.selectedKey = key;
      document.querySelectorAll('.entry-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.key === key);
      });

      const reader = $('#reader');
      reader.innerHTML = `
        <h2>${escapeHtml(item.title || formatDate(key))}</h2>
        <div class="reader-meta">${formatDate(key)}</div>
        <div class="body">일기를 불러오는 중입니다.</div>
      `;

      try {
        const entryResponse = await fetch(resolveDataUrl(item.entryUrl), { cache: 'no-store' });
        if (!entryResponse.ok) throw new Error(`entry ${entryResponse.status}`);
        const entry = await entryResponse.json();
        const bodyResponse = await fetch(resolveDataUrl(entry.bodyUrl), { cache: 'no-store' });
        if (!bodyResponse.ok) throw new Error(`body ${bodyResponse.status}`);
        const body = await bodyResponse.text();

        reader.innerHTML = `
          <h2>${escapeHtml(entry.title || item.title || formatDate(key))}</h2>
          <div class="reader-meta">${formatDate(key)}</div>
          <div class="body">${escapeHtml(body)}</div>
        `;
      } catch (error) {
        console.warn(error);
        reader.innerHTML = `
          <h2>${escapeHtml(item.title || formatDate(key))}</h2>
          <div class="reader-meta">${formatDate(key)}</div>
          <p class="empty">일기 본문을 불러오지 못했습니다. entry/text 파일이 커밋되어 배포됐는지 확인해 주세요.</p>
        `;
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function openWriter() {
      restoreWriterSettings();
      restoreDraft();
      $('#writerDialog').showModal();
      setWriterStatus('');
    }

    function getDraft() {
      return {
        date: $('#writerDate').value || todayKey(),
        title: $('#writerTitle').value.trim(),
        body: $('#writerBody').value
      };
    }

    function saveDraft() {
      localStorage.setItem('diaryWriterDraft:v2', JSON.stringify(getDraft()));
      saveWriterSettings();
      setWriterStatus('임시 저장했습니다.');
    }

    function restoreDraft() {
      const raw = localStorage.getItem('diaryWriterDraft:v2');
      let draft = null;
      try {
        draft = raw ? JSON.parse(raw) : null;
      } catch (_error) {
        draft = null;
      }
      $('#writerDate').value = draft?.date || todayKey();
      $('#writerTitle').value = draft?.title || '';
      $('#writerBody').value = draft?.body || '';
    }

    function saveWriterSettings() {
      localStorage.setItem('diaryWriterApiUrl:v2', $('#writerApiUrl').value.trim());
      sessionStorage.setItem('diaryWriterToken:v2', $('#writerToken').value);
    }

    function restoreWriterSettings() {
      $('#writerApiUrl').value = localStorage.getItem('diaryWriterApiUrl:v2') || '';
      $('#writerToken').value = sessionStorage.getItem('diaryWriterToken:v2') || '';
    }

    function setWriterStatus(message) {
      $('#writerStatus').textContent = message || '';
    }

    function validateDraft(draft) {
      if (!draft.date) return '날짜를 선택해 주세요.';
      if (!draft.body.trim()) return '본문을 입력해 주세요.';
      return '';
    }

    function formatDiaryTxt(draft) {
      const title = draft.title ? `제목: ${draft.title}\n\n` : '';
      return `${formatDate(draft.date)}\n\n${title}${draft.body}`.replace(/\r\n/g, '\n');
    }

    function downloadTxt() {
      const draft = getDraft();
      const error = validateDraft(draft);
      if (error) {
        setWriterStatus(error);
        return;
      }
      saveDraft();
      const blob = new Blob([formatDiaryTxt(draft)], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${draft.date}.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      setWriterStatus('txt 파일을 다운로드했습니다.');
    }

    async function uploadDraft() {
      const draft = getDraft();
      const error = validateDraft(draft);
      if (error) {
        setWriterStatus(error);
        return;
      }

      const apiUrl = $('#writerApiUrl').value.trim();
      const token = $('#writerToken').value;
      if (!apiUrl) {
        setWriterStatus('Worker API URL을 입력해 주세요.');
        return;
      }
      if (!token) {
        setWriterStatus('쓰기 토큰을 입력해 주세요.');
        return;
      }

      saveDraft();
      setWriterStatus('업로드 중입니다.');
      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            date: draft.date,
            title: draft.title,
            body: draft.body,
            clientId: 'pwa'
          })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok) {
          throw new Error(payload.message || payload.error || `업로드 실패 (${response.status})`);
        }
        localStorage.removeItem('diaryWriterDraft:v2');
        $('#writerTitle').value = '';
        $('#writerBody').value = '';
        setWriterStatus(`업로드 완료: ${payload.path}`);
      } catch (error) {
        console.warn(error);
        setWriterStatus(`업로드 실패: ${error.message}`);
      }
    }

    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
      if (location.protocol !== 'https:' && !isLocal) return;
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((error) => {
          console.info('service worker registration skipped', error);
        });
      });
    }

    $('#reloadBtn').addEventListener('click', loadIndex);
    $('#openWriterBtn').addEventListener('click', openWriter);
    $('#saveDraftBtn').addEventListener('click', saveDraft);
    $('#downloadTxtBtn').addEventListener('click', downloadTxt);
    $('#uploadBtn').addEventListener('click', uploadDraft);
    $('#writerApiUrl').addEventListener('input', saveWriterSettings);
    $('#writerToken').addEventListener('input', saveWriterSettings);

    loadIndex();
    registerServiceWorker();
  </script>
</body>
</html>
