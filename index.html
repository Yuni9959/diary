<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF4EA" />
<meta name="description" content="소중한 사람에게 전하는 일기를 모아 보는 개인용 일기 앱" />
<title>당신을 위한 따뜻한 마음 모음</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     색 · 글꼴 토큰  (청첩장의 아이보리 톤 + 사계절 수채화 색)
     ========================================================= */
  :root{
    --paper:#FAF4EA;          /* 따뜻한 종이빛 배경 */
    --ink:#4B423A;            /* 먹빛 글자 */
    --ink-soft:#7A6E60;       /* 보조 글자 */
    --muted:#CDC1AF;          /* 일기 없는 날짜 */
    --line:rgba(75,66,58,.12);
    --card:rgba(255,253,248,.82);

    --c-spring:#EBA9A3;       /* 봄  · 벚꽃 */
    --c-summer:#ECA23F;       /* 여름 · 해 */
    --c-maple:#E79B57;        /* 가을 · 단풍 */
    --c-ginkgo:#E0C44A;       /* 가을 · 은행 */
    --c-winter:#A7CBD4;       /* 겨울 · 눈송이 */

    --gold:#C49A5E;           /* 일기 표시 점 · 오늘 강조 */
    --sun:#C77E5B;            /* 일요일 */
    --sat:#6E94A6;            /* 토요일 */

    --serif:'Gowun Batang', serif;
    --serif-display:'Nanum Myeongjo', serif;

    --reading-scale:1;        /* 모달 글자 크기 (JS가 조절) */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:var(--serif);
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    overflow-x:hidden;
  }

  /* =========================================================
     배경 레이어 — 고정. 콘텐츠만 그 위로 움직인다.
     ========================================================= */
  .bg{
    position:fixed; inset:0; z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  /* 부케 — 인트로에서 내려앉아 은은하게 머무는 배경 */
  .bg__bouquet{
    position:absolute; top:50%; left:50%;
    width:min(78vmin,620px); aspect-ratio:1614/1568;
    transform:translate(-50%,-52%);
    background:url('img/bouquet.png') center/contain no-repeat;
    opacity:0;                 /* 인트로가 끝난 뒤 JS가 띄움 */
    transition:opacity 2s ease 0.2s;
  }
  .bg__bouquet.show{ opacity:var(--bouquet-bg-op,.12); }

  .deco{
    position:absolute;
    background-position:center;
    background-repeat:no-repeat;
    background-size:contain;
    opacity:0;
    transform:rotate(var(--rot,0deg)) scale(.9);
    transition:opacity 1.4s ease, transform 1.4s ease;
    filter:saturate(.96);
  }
  .deco.show{ opacity:var(--deco-op,.22); transform:rotate(var(--rot,0deg)) scale(1); }

  /* =========================================================
     첫 화면 인트로 — 부케가 크게 떴다가 페이드아웃
     ========================================================= */
  .intro{
    position:fixed; inset:0; z-index:60;
    display:grid; place-items:center;
    background:var(--paper);
    transition:opacity 1.7s ease;
  }
  .intro__art{
    width:min(72vw,520px); aspect-ratio:1614/1568;
    background:url('img/bouquet.png') center/contain no-repeat;
    animation:introBreath 3.4s ease-in-out infinite;
    will-change:transform,opacity;
  }
  .intro__cap{
    position:absolute; bottom:13%;
    text-align:center; width:100%;
    color:var(--ink-soft);
    font-family:var(--serif-display);
    letter-spacing:.32em; font-size:.92rem;
    opacity:0; animation:capIn 1.6s ease .5s forwards;
  }
  @keyframes introBreath{ 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-6px) scale(1.012);} }
  @keyframes capIn{ to{ opacity:1; } }
  .intro.fade{ opacity:0; pointer-events:none; }
  .intro.gone{ display:none; }

  /* =========================================================
     본문 콘텐츠
     ========================================================= */
  .wrap{
    position:relative; z-index:1;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(28px,7vh,72px) 18px 64px;
  }
  .masthead{ text-align:center; margin-bottom:clamp(20px,4vh,34px); max-width:min(92vw,460px); }
  .masthead .ko{
    font-family:var(--serif-display);
    font-weight:800;
    font-size:clamp(1.4rem,5vw,1.95rem);
    letter-spacing:.01em;
    line-height:1.4;
    text-wrap:balance;
    margin:0;
  }
  .masthead .rule{
    width:46px; height:1px; background:var(--gold);
    margin:16px auto 0; opacity:.7;
  }

  /* ---------- 달력 카드 ---------- */
  .cal{
    width:min(100%,460px);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    box-shadow:0 18px 50px -28px rgba(75,66,58,.45);
    backdrop-filter:blur(7px) saturate(1.05);
    -webkit-backdrop-filter:blur(7px) saturate(1.05);
    padding:clamp(18px,4vw,28px);
  }
  .cal__nav{
    display:flex; align-items:center; justify-content:center;
    gap:10px; margin-bottom:18px;
  }
  .cal__arrow{
    border:1px solid var(--line); background:transparent;
    width:38px; height:38px; border-radius:50%;
    color:var(--ink); cursor:pointer; font-size:1rem;
    display:grid; place-items:center;
    transition:background .25s ease, border-color .25s ease;
    flex:none;
  }
  .cal__arrow:hover{ background:rgba(196,154,94,.12); border-color:var(--gold); }
  .cal__title{ display:flex; align-items:baseline; gap:6px; }
  .selwrap{ position:relative; }
  .cal__sel{
    appearance:none; -webkit-appearance:none;
    border:none; background:transparent;
    font-family:var(--serif-display); font-weight:700;
    color:var(--ink); cursor:pointer;
    padding:4px 2px; border-radius:8px;
    text-align:center; text-align-last:center;
  }
  .cal__sel.year{ font-size:1.18rem; }
  .cal__sel.month{ font-size:1.18rem; }
  .cal__sel:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .cal__suffix{ font-family:var(--serif-display); font-weight:700; font-size:1.05rem; color:var(--ink); }

  .cal__dow{
    display:grid; grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .cal__dow span{
    text-align:center; font-size:.72rem; letter-spacing:.04em;
    color:var(--ink-soft); padding:6px 0; font-family:var(--serif-display);
  }
  .cal__grid{
    display:grid; grid-template-columns:repeat(7,1fr);
    gap:2px;
  }
  .day{
    position:relative;
    aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    font-size:1.02rem;
    color:var(--muted);
    border-radius:12px;
    user-select:none;
  }
  .day.blank{ visibility:hidden; }
  .day.sun{ color:#DCC1B0; }   /* 옅은 일요일 */
  .day.sat{ color:#BFCBD2; }
  .day.has{
    color:var(--ink); font-weight:700; cursor:pointer;
    transition:background .2s ease, transform .15s ease;
  }
  .day.has.sun{ color:var(--sun); }
  .day.has.sat{ color:var(--sat); }
  .day.has:hover{ background:rgba(196,154,94,.14); }
  .day.has:active{ transform:scale(.94); }
  .day.has::after{                 /* 일기 있는 날 점 */
    content:""; position:absolute; bottom:7px;
    width:5px; height:5px; border-radius:50%;
    background:var(--gold);
  }
  .day.today{ box-shadow:inset 0 0 0 1.5px var(--gold); }
  .day .num{ position:relative; z-index:1; }

  .cal__foot{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:.76rem; color:var(--ink-soft);
  }
  .cal__foot .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); display:inline-block; }

  .write-entry{
    margin-top:18px; display:flex; justify-content:center;
  }
  .write-entry__btn{
    border:1px solid rgba(196,154,94,.42);
    background:rgba(255,253,248,.74);
    color:var(--ink); border-radius:999px; cursor:pointer;
    min-height:42px; padding:0 18px;
    font-family:var(--serif); font-size:.95rem; font-weight:700;
    box-shadow:0 12px 28px -22px rgba(40,32,24,.55);
  }
  .write-entry__btn:hover{ background:rgba(196,154,94,.12); }

  /* =========================================================
     일기 모달
     ========================================================= */
  .modal{
    position:fixed; inset:0; z-index:100;
    display:grid; place-items:center;
    padding:18px;
    background:rgba(58,50,42,.34);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none;
    transition:opacity .4s ease;
  }
  .modal.open{ opacity:1; pointer-events:auto; }
  body.diary-reading-fullscreen{ overflow:hidden; }
  .sheet{
    width:min(100%,520px);
    max-height:88dvh; overflow:auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:0 30px 80px -30px rgba(40,32,24,.6);
    padding:clamp(22px,5vw,34px);
    transform:translateY(18px) scale(.98);
    transition:transform .42s cubic-bezier(.2,.8,.25,1);
  }
  .modal.open .sheet{ transform:none; }

  .sheet__top{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:6px;
  }
  .sheet__date{
    font-family:var(--serif-display); color:var(--ink-soft);
    font-size:.86rem; letter-spacing:.03em;
  }
  .sheet__tools{ display:flex; align-items:center; gap:6px; }
  .tbtn{
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    width:30px; height:30px; border-radius:50%; cursor:pointer;
    display:grid; place-items:center; font-family:var(--serif); line-height:1;
    transition:background .2s, color .2s, border-color .2s;
  }
  .tbtn:hover{ background:rgba(196,154,94,.12); border-color:var(--gold); color:var(--ink); }
  .tbtn.az{ font-size:.7rem; } .tbtn.az b{ font-size:.96rem; }
  .tbtn.fullscreen{ font-size:.95rem; }
  .tbtn.close{ font-size:1.1rem; }

  .modal.reader-fullscreen{
    padding:0;
    place-items:stretch;
    background:var(--paper);
    backdrop-filter:none;
  }
  .modal.reader-fullscreen .sheet{
    width:100vw;
    height:100dvh;
    max-height:100dvh;
    border-radius:0;
    border:0;
    box-shadow:none;
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(18px + env(safe-area-inset-right))
      calc(24px + env(safe-area-inset-bottom))
      calc(18px + env(safe-area-inset-left));
    transform:none;
    background:var(--paper);
    overflow:auto;
  }
  .modal.reader-fullscreen .sheet__top{
    position:sticky;
    top:calc(-14px - env(safe-area-inset-top));
    z-index:2;
    margin:
      calc(-14px - env(safe-area-inset-top))
      calc(-18px - env(safe-area-inset-right))
      14px
      calc(-18px - env(safe-area-inset-left));
    padding:
      calc(14px + env(safe-area-inset-top))
      calc(18px + env(safe-area-inset-right))
      12px
      calc(18px + env(safe-area-inset-left));
    background:var(--paper);
    border-bottom:1px solid rgba(196,154,94,.18);
  }

  .sheet__title{
    font-family:var(--serif-display); font-weight:800;
    font-size:calc(1.34rem * var(--reading-scale));
    line-height:1.35; margin:.4em 0 .7em;
    text-wrap:pretty;
  }
  .sheet__photos{ display:flex; flex-direction:column; gap:10px; margin:0 0 18px; }
  .sheet__photo{ margin:0; }
  .sheet__photos img{
    width:100%; border-radius:14px; display:block;
    border:1px solid var(--line);
  }
  .sheet__caption{ margin:6px 4px 0; font-size:.86rem; color:var(--muted); line-height:1.5; }
  .sheet__body p{
    font-size:calc(1.04rem * var(--reading-scale));
    line-height:1.95; margin:0 0 1em; color:#564C42;
    text-wrap:pretty; white-space:pre-line;
  }
  .sheet__body p:last-child{ margin-bottom:0; }

  .writer-sheet{ width:min(100%,620px); }
  .writer-form{ display:grid; gap:14px; }
  .writer-field{ display:grid; gap:7px; }
  .writer-field label{
    font-size:.82rem; color:var(--ink-soft); font-weight:700;
  }
  .writer-field input,
  .writer-field textarea{
    width:100%; border:1px solid var(--line); border-radius:14px;
    background:rgba(255,253,248,.76); color:var(--ink);
    font-family:var(--serif); font-size:16px;
    padding:12px 13px; outline:none;
  }
  .writer-field textarea{
    min-height:min(46dvh,420px); resize:vertical; line-height:1.85;
  }
  .writer-field input:focus,
  .writer-field textarea:focus{
    border-color:var(--gold); box-shadow:0 0 0 3px rgba(196,154,94,.14);
  }
  .writer-actions{
    display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;
  }
  .writer-actions button{
    border:1px solid var(--line); border-radius:14px;
    background:rgba(255,253,248,.8); color:var(--ink);
    min-height:42px; padding:0 10px; cursor:pointer;
    font-family:var(--serif); font-weight:700;
  }
  .writer-actions button.primary{
    border-color:rgba(196,154,94,.58); background:rgba(196,154,94,.14);
  }
  .writer-status{ min-height:1.4em; font-size:.82rem; color:var(--ink-soft); line-height:1.55; }
  .writer-settings{
    border:1px solid rgba(75,66,58,.1); border-radius:16px;
    padding:12px; background:rgba(255,253,248,.48);
    display:grid; gap:10px;
  }
  .writer-settings summary{
    cursor:pointer; color:var(--ink-soft); font-size:.86rem; font-weight:700;
  }
  .writer-outbox{
    font-size:.82rem; color:var(--ink-soft); line-height:1.55;
    padding:10px 12px; border-radius:14px; background:rgba(196,154,94,.08);
  }
  .auth-sheet{ width:min(100%,440px); }
  .auth-form{ display:grid; gap:14px; }
  .auth-actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px; }
  .auth-actions button{
    border:1px solid var(--line); border-radius:14px;
    background:rgba(255,253,248,.8); color:var(--ink);
    min-height:42px; padding:0 10px; cursor:pointer;
    font-family:var(--serif); font-weight:700;
  }
  .auth-actions button.primary{
    border-color:rgba(196,154,94,.58); background:rgba(196,154,94,.14);
  }
  .auth-status{ min-height:1.4em; font-size:.82rem; color:var(--ink-soft); line-height:1.55; }
  @media (max-width:480px){
    .writer-actions{ grid-template-columns:1fr; }
    .auth-actions{ grid-template-columns:1fr; }
  }

  @media (max-width:480px){
    .deco{ filter:saturate(.96); }
  }
  @media (prefers-reduced-motion:reduce){
    .intro__art{ animation:none; }
    *{ transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

  <!-- 배경(고정) -->
  <div class="bg" aria-hidden="true">
    <div class="bg__bouquet" id="bgBouquet"></div>
  </div>

  <!-- 첫 화면 인트로 -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__art"></div>
    <div class="intro__cap">당신을 위한 따뜻한 마음 모음</div>
  </div>

  <!-- 본문 -->
  <main class="wrap">
    <header class="masthead">
      <h1 class="ko" id="headerText">당신을 위한 따뜻한 마음 모음</h1>
      <div class="rule"></div>
      <div class="write-entry">
        <button class="write-entry__btn" id="openWriterBtn" type="button">글쓰기</button>
      </div>
    </header>

    <section class="cal" aria-label="달력">
      <div class="cal__nav">
        <button class="cal__arrow" id="prevBtn" aria-label="이전 달">‹</button>
        <div class="cal__title">
          <span class="selwrap"><select class="cal__sel year" id="yearSel" aria-label="연도"></select></span>
          <span class="cal__suffix">년</span>
          <span class="selwrap"><select class="cal__sel month" id="monthSel" aria-label="월"></select></span>
          <span class="cal__suffix">월</span>
        </div>
        <button class="cal__arrow" id="nextBtn" aria-label="다음 달">›</button>
      </div>

      <div class="cal__dow" id="dowRow"></div>
      <div class="cal__grid" id="grid"></div>

      <div class="cal__foot"><span class="dot"></span> 일기가 있는 날은 진하게 표시돼요</div>
    </section>
  </main>

  <!-- 일기 모달 -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet" id="sheet">
      <div class="sheet__top">
        <span class="sheet__date" id="sheetDate"></span>
        <div class="sheet__tools">
          <button class="tbtn az" id="fontDown" aria-label="글자 작게">A<span style="font-size:.6rem">－</span></button>
          <button class="tbtn az" id="fontUp" aria-label="글자 크게"><b>A</b><span style="font-size:.66rem">＋</span></button>
          <button class="tbtn fullscreen" id="fullscreenBtn" aria-label="전체 화면으로 보기" aria-pressed="false" title="전체 화면">⛶</button>
          <button class="tbtn close" id="closeBtn" aria-label="닫기">×</button>
        </div>
      </div>
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <div class="sheet__photos" id="sheetPhotos"></div>
      <div class="sheet__body" id="sheetBody"></div>
    </div>
  </div>

  <!-- 글쓰기 모달: Phase 1 local draft only -->
  <div class="modal" id="writerModal" role="dialog" aria-modal="true" aria-labelledby="writerTitle">
    <div class="sheet writer-sheet">
      <div class="sheet__top">
        <span class="sheet__date">휴대폰에 임시 저장</span>
        <div class="sheet__tools">
          <button class="tbtn close" id="writerCloseBtn" aria-label="글쓰기 닫기">×</button>
        </div>
      </div>
      <h2 class="sheet__title" id="writerTitle">오늘의 마음 쓰기</h2>
      <form class="writer-form" id="writerForm">
        <div class="writer-field">
          <label for="writerDate">날짜</label>
          <input id="writerDate" name="date" type="date" required />
        </div>
        <div class="writer-field">
          <label for="writerTitleInput">제목</label>
          <input id="writerTitleInput" name="title" type="text" maxlength="80" placeholder="오늘의 마음" autocomplete="off" />
        </div>
        <div class="writer-field">
          <label for="writerBody">본문</label>
          <textarea id="writerBody" name="body" placeholder="여기에 긴 일기를 적어 주세요."></textarea>
        </div>
        <details class="writer-settings" id="writerSettings">
          <summary>업로드 설정</summary>
          <div class="writer-field">
            <label for="writerApiUrl">Worker API URL</label>
            <input id="writerApiUrl" name="apiUrl" type="url" placeholder="https://your-worker.example.workers.dev/api/diary" autocomplete="off" />
          </div>
          <div class="writer-field">
            <label for="writerToken">쓰기 토큰</label>
            <input id="writerToken" name="writeToken" type="password" placeholder="Worker WRITE_TOKEN" autocomplete="off" />
          </div>
        </details>
        <div class="writer-actions">
          <button type="button" class="primary" id="saveDraftBtn">임시 저장</button>
          <button type="button" class="primary" id="uploadDraftBtn">저장</button>
          <button type="button" id="downloadDraftBtn">txt 다운로드</button>
          <button type="button" id="retryUploadBtn">다시 보내기</button>
          <button type="button" id="restoreDraftBtn">작성 중인 글 복구</button>
          <button type="button" id="clearDraftBtn">초기화</button>
        </div>
        <div class="writer-outbox" id="writerOutbox">전송 대기 글 0개</div>
        <div class="writer-status" id="writerStatus" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <div class="modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="sheet auth-sheet">
      <div class="sheet__top">
        <span class="sheet__date" id="authState">Supabase</span>
        <div class="sheet__tools">
          <button class="tbtn close" id="authCloseBtn" aria-label="Sign in close">×</button>
        </div>
      </div>
      <h2 class="sheet__title" id="authTitle">Sign in</h2>
      <form class="auth-form" id="authForm">
        <div class="writer-field">
          <label for="authEmail">Email</label>
          <input id="authEmail" name="email" type="email" autocomplete="username" inputmode="email" />

<script src="lib/supabase-runtime-config.js"></script>
<script>
/* =============================================================
   설정 — 여기만 바꾸면 동작이 달라집니다.
   ============================================================= */
const CONFIG = {
  indexUrl: 'Diary_formyWife/data/diary-index.json',
  dataPathPrefix: 'Diary_formyWife/',
  headerText: '당신을 위한 따뜻한 마음 모음',
  weekStartsOn: 0,          // 0 = 일요일, 1 = 월요일
  introEveryTime: true,     // 접속할 때마다 인트로 보여주기
  bgIntensity: 20,          // 배경 그림이 비치는 정도 (0~100)
  yearRange: 4              // 연도 선택 범위 (오늘 기준 ±N년)
};

/* data/diary-index.json 형식 (참고)
{
  "2026-06-08": {
    "title": "제목",
    "entryUrl": "data/entries/2026-06-08.json",
    "hasPhotos": true
  }
}
*/

/* 데이터 파일을 못 불러올 때(예: 로컬 파일로 직접 열 때) 보여줄 예시 */
const FALLBACK_INDEX = {
  "2026-06-01": { "title":"유월의 첫 아침", "entryUrl":"fallback:2026-06-01", "hasPhotos":true },
  "2026-06-03": { "title":"퇴근길에 산 작은 꽃", "entryUrl":"fallback:2026-06-03", "hasPhotos":false },
  "2026-06-08": { "title":"비 오는 날의 우리", "entryUrl":"fallback:2026-06-08", "hasPhotos":true },
  "2026-06-14": { "title":"당신이 웃던 순간", "entryUrl":"fallback:2026-06-14", "hasPhotos":false },
  "2026-06-21": { "title":"함께 걸은 저녁 산책", "entryUrl":"fallback:2026-06-21", "hasPhotos":true }
};
const FALLBACK_ENTRIES = {
  "2026-06-01": { "date":"2026-06-01", "title":"유월의 첫 아침", "body":"오늘부터 당신에게 보내는 마음을 이곳에 모으기로 했어요.\n창문으로 들어오는 햇살이 당신 자는 얼굴에 닿는 걸 한참 바라봤어요.", "photos":["img/photo-sample-1.jpg"] },
  "2026-06-03": { "date":"2026-06-03", "title":"퇴근길에 산 작은 꽃", "body":"집에 오는 길, 꽃집 앞을 그냥 못 지나쳤어요. 당신이 좋아하던 색이라서요.", "photos":[] },
  "2026-06-08": { "date":"2026-06-08", "title":"비 오는 날의 우리", "body":"비가 와서 하루 종일 집에 있었어요. 빗소리 들으며 같이 마신 차 한 잔이 어떤 여행보다 좋았어요.", "photos":["img/photo-sample-2.jpg"] },
  "2026-06-14": { "date":"2026-06-14", "title":"당신이 웃던 순간", "body":["오늘 당신이 크게 웃는 걸 봤어요.","그 웃음 하나에 하루의 피로가 다 사라졌어요."], "photos":[] },
  "2026-06-21": { "date":"2026-06-21", "title":"함께 걸은 저녁 산책", "body":"해가 길어진 저녁, 손잡고 동네를 한 바퀴 돌았어요. 마음이 가득 찼어요.", "photos":["img/photo-sample-1.jpg","img/photo-sample-2.jpg"] }
};

/* ------------------------------------------------------------ */
let DIARY_INDEX = {};
const ENTRY_CACHE = {};
const TEXT_CACHE = {};
let diarySupabase = null;
let diarySupabaseReady = Promise.resolve(null);
let lastNativeFullscreenExitAt = 0;
const WRITER_DRAFT_KEY = 'diaryWriterDraft:v1';
const WRITER_SETTINGS_KEY = 'diaryWriterSettings:v1';
const WRITER_TOKEN_SESSION_KEY = 'diaryWriterToken:session:v1';
const WRITER_OUTBOX_KEY = 'diaryWriterOutbox:v1';
const WRITER_ARCHIVE_KEY = 'diaryWriterArchive:v1';
const $ = (s)=>document.querySelector(s);
const pad = (n)=>String(n).padStart(2,'0');
const keyOf = (y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const DOW_KO = ['일','월','화','수','목','금','토'];
const resolveDataUrl = (url)=>{
  if(!url || /^(?:[a-z]+:)?\/\//i.test(url) || url.startsWith('/') || url.startsWith(CONFIG.dataPathPrefix)) return url;
  if(url.startsWith('data/')) return CONFIG.dataPathPrefix + url;
  return url;
};
const hasSupabaseSession = ()=>!!diarySupabase?.getSession?.()?.access_token;

async function initDiarySupabase(){
  const runtimeConfig = window.DIARY_SUPABASE_CONFIG;
  if(!runtimeConfig || !runtimeConfig.enabled || !runtimeConfig.url || !runtimeConfig.publishableKey){
    installDiarySupabaseAdmin();
    return null;
  }
  try{
    const mod = await import('./lib/diary-service.js');
    diarySupabase = mod.createDiaryService({
      supabaseUrl: runtimeConfig.url,
      publishableKey: runtimeConfig.publishableKey
    });
    installDiarySupabaseAdmin();
    return diarySupabase;
  }catch(e){
    console.warn('Supabase diary service unavailable; static data remains active.', e);
    installDiarySupabaseAdmin();
    return null;
  }
}

function sanitizeSupabaseEntry(entry){
  if(!entry) return {found:false};
  return {
    found:true,
    id:entry.id,
    date:entry.date,
    bodyFormat:entry.body_format,
    source:entry.source,
    hasBody:!!entry.bodyText
  };
}

function authEls(){
  return {
    modal: $('#authModal'),
    state: $('#authState'),
    title: $('#authTitle'),
    email: $('#authEmail'),
    password: $('#authPassword'),
    status: $('#authStatus'),
    signIn: $('#authSignInBtn'),
    signOut: $('#authSignOutBtn')
  };
}

function setAuthStatus(message){
  const els = authEls();
  if(els.status) els.status.textContent = message || '';
}

function updateAuthModalState(){
  const els = authEls();
  const configured = !!diarySupabase;
  const signedIn = hasSupabaseSession();
  if(els.state) els.state.textContent = signedIn ? 'Signed in' : (configured ? 'Ready' : 'Not configured');
  if(els.signIn) els.signIn.disabled = !configured || signedIn;
  if(els.signOut) els.signOut.disabled = !configured || !signedIn;
  if(els.email) els.email.disabled = !configured || signedIn;
  if(els.password) els.password.disabled = !configured || signedIn;
}

async function openAuth(){
  await diarySupabaseReady;
  const els = authEls();
  updateAuthModalState();
  setAuthStatus(hasSupabaseSession() ? 'Already signed in.' : '');
  els.modal.classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(()=>{ if(!hasSupabaseSession()) els.email.focus(); }, 120);
}

function closeAuth(){
  const els = authEls();
  els.password.value = '';
  els.modal.classList.remove('open');
  if(!$('#modal').classList.contains('open') && !$('#writerModal').classList.contains('open')) document.body.style.overflow='';
}

async function submitAuthForm(event){
  event.preventDefault();
  const service = await diarySupabaseReady;
  const els = authEls();
  if(!service){
    setAuthStatus('Supabase is not configured.');
    updateAuthModalState();
    return;
  }
  setAuthStatus('Signing in...');
  try{
    await service.signInWithPassword(els.email.value, els.password.value);
    els.password.value = '';
    updateAuthModalState();
    await loadData();
    setAuthStatus('Signed in.');
    setTimeout(()=>{ if(hasSupabaseSession()) closeAuth(); }, 450);
  }catch(_e){
    els.password.value = '';
    setAuthStatus('Sign in failed. Please check the email and password.');
    updateAuthModalState();
  }
}

async function signOutFromAuth(){
  const service = await diarySupabaseReady;
  if(service) service.signOut();
  updateAuthModalState();
  await loadData();
  setAuthStatus('Signed out.');
}

function shouldOpenAuthFromLocation(){
  const params = new URLSearchParams(window.location.search);
  return window.location.hash === '#auth' || params.get('auth') === '1';
}

function installDiarySupabaseAdmin(){
  window.diarySupabaseAdmin = {
    async status(){
      const service = await diarySupabaseReady;
      if(!service){
        return {configured:false, signedIn:false};
      }
      const signedIn = hasSupabaseSession();
      const entries = await service.listEntries();
      const dates = entries.map(entry=>entry.date).sort();
      return {
        configured:true,
        signedIn,
        count:dates.length,
        firstDate:dates[0] || null,
        lastDate:dates[dates.length - 1] || null,
        sampleDates:dates.slice(0, 5)
      };
    },
    async signIn(email, password){
      const service = await diarySupabaseReady;
      if(!service) throw new Error('Supabase is not configured.');
      await service.signInWithPassword(email, password);
      await loadData();
      return {signedIn:true};
    },
    async signOut(){
      const service = await diarySupabaseReady;
      if(service) service.signOut();
      await loadData();
      return {signedIn:false};
    },
    async openAuth(){
      await openAuth();
      return {opened:true};
    },
    closeAuth(){
      closeAuth();
      return {closed:true};
    },
    async listEntries(){
      const service = await diarySupabaseReady;
      if(!service) return [];
      const entries = await service.listEntries();
      return entries.map(entry=>entry.date).sort();
    },
    async getEntryByDate(date){
      const service = await diarySupabaseReady;
      if(!service) return {found:false};
      return sanitizeSupabaseEntry(await service.getEntryByDate(date));
    },
    async deleteEntryByDate(date){
      const service = await diarySupabaseReady;
      if(!service || !hasSupabaseSession()) throw new Error('Supabase is not signed in.');
      const deleted = await service.deleteEntryByDate(date);
      if(deleted){
        delete DIARY_INDEX[date];
        delete ENTRY_CACHE[date];
        renderCalendar();
      }
      return {deleted, date};
    }
  };
}

const today = new Date();
let viewY = today.getFullYear();
let viewM = today.getMonth(); // 0~11

/* ---------- 배경 장식: 고정 위치 + 매번 랜덤 배치 ---------- */
function paintDecorations(){
  const bg = $('.bg');
  bg.querySelectorAll('.deco').forEach(el=>el.remove());

  const op = Math.max(0, Math.min(1, CONFIG.bgIntensity/100 * 1.1));
  document.documentElement.style.setProperty('--deco-op', op.toFixed(3));
  document.documentElement.style.setProperty('--bouquet-bg-op', (op*0.6 + 0.04).toFixed(3));

  // 정해진 위치(슬롯)들
  const slots = [
    { top:'5%',  left:'3%',  size:150, rot:-12 },
    { top:'9%',  right:'4%', size:128, rot:11 },
    { bottom:'7%', left:'5%', size:140, rot:9 },
    { bottom:'12%', right:'3%', size:158, rot:-8 },
    { top:'45%', left:'1%',  size:104, rot:16 },
    { top:'52%', right:'1%', size:112, rot:-15 }
  ];
  // 사계절 그림 — 어느 슬롯에 놓일지는 매번 랜덤
  const imgs = ['spring','summer','maple','ginkgo','winter'];
  const shuffled = slots.map(s=>s).sort(()=>Math.random()-0.5);
  imgs.forEach((name,i)=>{
    const s = shuffled[i]; if(!s) return;
    const el = document.createElement('div');
    el.className = 'deco';
    el.style.setProperty('--rot', s.rot+'deg');
    el.style.width = el.style.height = s.size+'px';
    ['top','left','right','bottom'].forEach(k=>{ if(s[k]!=null) el.style[k]=s[k]; });
    el.style.backgroundImage = `url('img/${name}.png')`;
    bg.appendChild(el);
    setTimeout(()=> el.classList.add('show'), 80 + i*60);
  });
}

/* ---------- 인트로 ---------- */
function runIntro(){
  const intro = $('#intro');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!CONFIG.introEveryTime || reduce){
    intro.classList.add('fade');
    setTimeout(()=>intro.classList.add('gone'), reduce?100:1700);
    $('#bgBouquet').classList.add('show');
    return;
  }
  // 잠시 보여준 뒤 페이드아웃 → 배경 부케가 떠오름
  setTimeout(()=>{
    intro.classList.add('fade');
    $('#bgBouquet').classList.add('show');
    setTimeout(()=>intro.classList.add('gone'), 1750);
  }, 1900);
}

/* ---------- 연/월 선택 ---------- */
function buildSelectors(){
  const ys = $('#yearSel'), ms = $('#monthSel');
  const y0 = today.getFullYear() - CONFIG.yearRange;
  const y1 = today.getFullYear() + CONFIG.yearRange;
  ys.innerHTML=''; ms.innerHTML='';
  for(let y=y0; y<=y1; y++){
    const o=document.createElement('option'); o.value=y; o.textContent=y; ys.appendChild(o);
  }
  for(let m=0; m<12; m++){
    const o=document.createElement('option'); o.value=m; o.textContent=m+1; ms.appendChild(o);
  }
  ys.value=viewY; ms.value=viewM;
  ys.addEventListener('change', ()=>{ viewY=+ys.value; renderCalendar(); });
  ms.addEventListener('change', ()=>{ viewM=+ms.value; renderCalendar(); });
}

/* ---------- 달력 그리기 ---------- */
function renderDow(){
  const row = $('#dowRow'); row.innerHTML='';
  for(let i=0;i<7;i++){
    const idx = (CONFIG.weekStartsOn + i) % 7;
    const s = document.createElement('span');
    s.textContent = DOW_KO[idx];
    if(idx===0) s.style.color='var(--sun)';
    if(idx===6) s.style.color='var(--sat)';
    row.appendChild(s);
  }
}

function renderCalendar(){
  $('#yearSel').value = viewY;
  $('#monthSel').value = viewM;
  const grid = $('#grid'); grid.innerHTML='';

  const first = new Date(viewY, viewM, 1);
  const startDow = (first.getDay() - CONFIG.weekStartsOn + 7) % 7;
  const daysInMonth = new Date(viewY, viewM+1, 0).getDate();

  for(let i=0;i<startDow;i++){
    const b=document.createElement('div'); b.className='day blank'; grid.appendChild(b);
  }
  for(let d=1; d<=daysInMonth; d++){
    const cell=document.createElement('div');
    cell.className='day';
    const dow = new Date(viewY,viewM,d).getDay();
    if(dow===0) cell.classList.add('sun');
    if(dow===6) cell.classList.add('sat');

    const k = keyOf(viewY,viewM,d);
    const has = !!DIARY_INDEX[k];
    if(has) cell.classList.add('has');
    if(viewY===today.getFullYear() && viewM===today.getMonth() && d===today.getDate())
      cell.classList.add('today');

    const num=document.createElement('span'); num.className='num'; num.textContent=d;
    cell.appendChild(num);
    if(has){
      cell.setAttribute('role','button');
      cell.setAttribute('tabindex','0');
      cell.setAttribute('aria-label', `${viewM+1}월 ${d}일 일기 보기`);
      const open=()=>openDiary(k);
      cell.addEventListener('click', open);
      cell.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); }});
    }
    grid.appendChild(cell);
  }
}

/* ---------- 일기 모달 ---------- */
function showBodyLines(lines){
  const body=$('#sheetBody'); body.innerHTML='';
  const items = Array.isArray(lines)
    ? lines
    : String(lines||'').replace(/\r\n/g, '\n').split(/\n[ \t]*\n/);
  if(items.length===0 || items.every(line=>String(line).trim()==='')){
    const p=document.createElement('p');
    p.textContent = '아직 적힌 본문이 없어요.';
    body.appendChild(p);
    return;
  }
  items.forEach(line=>{
    const p=document.createElement('p');
    p.textContent = String(line).trim()===''? '\u00A0' : line;
    body.appendChild(p);
  });
}
function renderPhotos(photos){
  const ph = $('#sheetPhotos'); ph.innerHTML='';
  (photos||[]).forEach(photo=>{
    const info = typeof photo === 'string' ? {src:photo, alt:'', caption:''} : (photo||{});
    if(!info.src) return;
    const figure=document.createElement('figure');
    figure.className='sheet__photo';
    const img=new Image();
    img.src=resolveDataUrl(info.src);
    img.alt=info.alt || '';
    img.onerror=()=>figure.remove();
    figure.appendChild(img);
    if(info.caption){
      const cap=document.createElement('figcaption');
      cap.className='sheet__caption';
      cap.textContent=info.caption;
      figure.appendChild(cap);
    }
    ph.appendChild(figure);
  });
}
async function fetchEntry(key, indexItem){
  if(ENTRY_CACHE[key]) return ENTRY_CACHE[key];
  if(indexItem.entryUrl && indexItem.entryUrl.startsWith('supabase:')){
    const service = await diarySupabaseReady;
    if(!service) throw new Error('Supabase service unavailable');
    const entry = await service.getEntryByDate(key);
    if(!entry) throw new Error('Supabase entry missing');
    ENTRY_CACHE[key] = entry;
    return ENTRY_CACHE[key];
  }
  if(indexItem.entryUrl && indexItem.entryUrl.startsWith('fallback:')){
    ENTRY_CACHE[key] = FALLBACK_ENTRIES[key] || {};
    return ENTRY_CACHE[key];
  }
  if(!indexItem.entryUrl) throw new Error('entryUrl is missing');
  const res = await fetch(resolveDataUrl(indexItem.entryUrl), {cache:'no-store'});
  if(!res.ok) throw new Error(res.status);
  ENTRY_CACHE[key] = await res.json();
  return ENTRY_CACHE[key];
}
async function fetchBodyText(bodyUrl){
  if(TEXT_CACHE[bodyUrl] !== undefined) return TEXT_CACHE[bodyUrl];
  const res = await fetch(resolveDataUrl(bodyUrl), {cache:'no-store'});
  if(!res.ok) throw new Error(res.status);
  TEXT_CACHE[bodyUrl] = await res.text();
  return TEXT_CACHE[bodyUrl];
}
function getNativeFullscreenElement(){
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}
function isReadingFullscreen(){
  return $('#modal').classList.contains('reader-fullscreen') || !!getNativeFullscreenElement();
}
function updateFullscreenButton(){
  const btn = $('#fullscreenBtn');
  if(!btn) return;
  const active = isReadingFullscreen();
  btn.setAttribute('aria-label', active ? '전체 화면 해제' : '전체 화면으로 보기');
  btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  btn.title = active ? '전체 화면 해제' : '전체 화면';
  btn.textContent = active ? '↙' : '⛶';
}
async function enterReadingFullscreen(){
  const modal = $('#modal');
  const sheet = $('#sheet');
  modal.classList.add('reader-fullscreen');
  document.body.classList.add('diary-reading-fullscreen');
  document.body.style.overflow='hidden';
  updateFullscreenButton();

  try{
    if(sheet.requestFullscreen){
      await sheet.requestFullscreen({navigationUI:'hide'});
    }else if(sheet.webkitRequestFullscreen){
      sheet.webkitRequestFullscreen();
    }
  }catch(e){
    console.info('브라우저 전체화면 전환은 실패했지만 CSS 읽기 모드는 유지합니다.', e);
  }finally{
    updateFullscreenButton();
  }
}
async function exitReadingFullscreen(options={}){
  const modal = $('#modal');
  modal.classList.remove('reader-fullscreen');
  document.body.classList.remove('diary-reading-fullscreen');

  if(!options.skipNative && getNativeFullscreenElement()){
    try{
      if(document.exitFullscreen){
        await document.exitFullscreen();
      }else if(document.webkitExitFullscreen){
        document.webkitExitFullscreen();
      }
    }catch(e){
      console.info('브라우저 전체화면 해제 중 오류가 있었지만 읽기 모드는 정리했습니다.', e);
    }
  }

  updateFullscreenButton();
}
async function toggleReadingFullscreen(){
  if(isReadingFullscreen()){
    await exitReadingFullscreen();
  }else{
    await enterReadingFullscreen();
  }
}
async function openDiary(key){
  const indexItem = DIARY_INDEX[key]; if(!indexItem) return;
  await exitReadingFullscreen({skipNative:false});
  const [y,m,day] = key.split('-').map(Number);
  const dow = DOW_KO[new Date(y,m-1,day).getDay()];
  $('#sheetDate').textContent = `${y}년 ${m}월 ${day}일 ${dow}요일`;
  $('#sheetTitle').textContent = indexItem.title || '';
  renderPhotos([]);
  showBodyLines('일기를 불러오고 있어요...');

  const modal=$('#modal');
  modal.classList.add('open');
  $('#sheet').scrollTop=0;
  document.body.style.overflow='hidden';

  try{
    const entry = await fetchEntry(key, indexItem);
    $('#sheetTitle').textContent = entry.title || indexItem.title || '';
    renderPhotos(entry.photos || []);
    if(entry.bodyUrl){
      showBodyLines(await fetchBodyText(entry.bodyUrl));
    }else if(Array.isArray(entry.body)){
      showBodyLines(entry.body);
    }else{
      showBodyLines(entry.body || '');
    }
  }catch(e){
    console.warn('일기 상세 데이터를 불러오지 못했습니다.', e);
    renderPhotos([]);
    showBodyLines('일기를 불러오지 못했어요. 잠시 후 다시 열어 주세요.');
  }
}
async function closeDiary(){
  if(isReadingFullscreen()){
    await exitReadingFullscreen();
  }
  $('#modal').classList.remove('open');
  document.body.style.overflow='';
  updateFullscreenButton();
}

/* ---------- 글자 크기 (모바일 가독성) ---------- */
let fontScale = parseFloat(localStorage.getItem('diaryFontScale')||'1');
function applyFont(){
  fontScale = Math.max(0.85, Math.min(1.7, fontScale));
  document.documentElement.style.setProperty('--reading-scale', fontScale.toFixed(2));
  localStorage.setItem('diaryFontScale', fontScale);
}

/* ---------- Phase 1 글쓰기: localStorage draft + txt 다운로드 ---------- */
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function writerEls(){
  return {
    modal: $('#writerModal'),
    date: $('#writerDate'),
    title: $('#writerTitleInput'),
    body: $('#writerBody'),
    apiUrl: $('#writerApiUrl'),
    token: $('#writerToken'),
    status: $('#writerStatus')
  };
}
function getWriterDraft(){
  const els = writerEls();
  return {
    date: els.date.value || todayKey(),
    title: els.title.value.trim(),
    body: els.body.value,
    savedAt: new Date().toISOString()
  };
}
function setWriterStatus(message){
  const status = $('#writerStatus');
  if(status) status.textContent = message || '';
}
function readJsonStorage(key, fallback){
  try{
    const value = JSON.parse(localStorage.getItem(key) || 'null');
    return value == null ? fallback : value;
  }catch(_e){
    return fallback;
  }
}
function writeJsonStorage(key, value){
  localStorage.setItem(key, JSON.stringify(value));
}
function saveWriterSettings(){
  const els = writerEls();
  writeJsonStorage(WRITER_SETTINGS_KEY, {
    apiUrl: els.apiUrl.value.trim()
  });
  sessionStorage.setItem(WRITER_TOKEN_SESSION_KEY, els.token.value);
}
function restoreWriterSettings(){
  const els = writerEls();
  const settings = readJsonStorage(WRITER_SETTINGS_KEY, {});
  els.apiUrl.value = settings.apiUrl || '';
  els.token.value = sessionStorage.getItem(WRITER_TOKEN_SESSION_KEY) || '';
}
function saveWriterDraft(reason='임시 저장했어요.'){
  const draft = getWriterDraft();
  localStorage.setItem(WRITER_DRAFT_KEY, JSON.stringify(draft));
  saveWriterSettings();
  setWriterStatus(`${reason} (${new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'})})`);
}
function readWriterDraft(){
  try{
    return JSON.parse(localStorage.getItem(WRITER_DRAFT_KEY) || 'null');
  }catch(_e){
    return null;
  }
}
function restoreWriterDraft(showMessage=true){
  const els = writerEls();
  const draft = readWriterDraft();
  if(!draft){
    els.date.value = els.date.value || todayKey();
    if(showMessage) setWriterStatus('복구할 임시 저장 글이 없어요.');
    return false;
  }
  els.date.value = draft.date || todayKey();
  els.title.value = draft.title || '';
  els.body.value = draft.body || '';
  if(showMessage) setWriterStatus('작성 중이던 글을 복구했어요.');
  return true;
}
function clearWriterDraft(){
  localStorage.removeItem(WRITER_DRAFT_KEY);
  const els = writerEls();
  els.date.value = todayKey();
  els.title.value = '';
  els.body.value = '';
  setWriterStatus('임시 저장 글을 비웠어요.');
}
function readWriterOutbox(){
  const items = readJsonStorage(WRITER_OUTBOX_KEY, []);
  return Array.isArray(items) ? items : [];
}
function saveWriterOutbox(items){
  writeJsonStorage(WRITER_OUTBOX_KEY, items);
  updateWriterOutbox();
}
function updateWriterOutbox(){
  const el = $('#writerOutbox');
  if(!el) return;
  const count = readWriterOutbox().length;
  el.textContent = count ? `전송 대기 글 ${count}개 - 네트워크가 안정적일 때 다시 보내세요.` : '전송 대기 글 0개';
}
function queueWriterDraft(draft, reason){
  const items = readWriterOutbox();
  items.push({
    id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
    draft,
    reason: reason || 'upload_failed',
    queuedAt: new Date().toISOString()
  });
  saveWriterOutbox(items);
}
function archiveUploadedDraft(draft, response){
  const items = readJsonStorage(WRITER_ARCHIVE_KEY, []);
  const archive = Array.isArray(items) ? items : [];
  archive.unshift({
    draft,
    response,
    uploadedAt: new Date().toISOString()
  });
  writeJsonStorage(WRITER_ARCHIVE_KEY, archive.slice(0, 20));
}
function formatDiaryTxt(draft){
  const [y,m,d] = String(draft.date || todayKey()).split('-').map(Number);
  const dateLine = `${y}년 ${m}월 ${d}일`;
  const title = draft.title ? `제목: ${draft.title}\n\n` : '';
  return `${dateLine}\n\n${title}${draft.body || ''}`.replace(/\r\n/g, '\n');
}
function validateUploadDraft(draft){
  if(!draft.date) return '날짜를 먼저 선택해 주세요.';
  if(!draft.body.trim()) return '본문을 적은 뒤 저장해 주세요.';
  return '';
}
function writerApiSettings(){
  const els = writerEls();
  return {
    apiUrl: els.apiUrl.value.trim(),
    writeToken: els.token.value
  };
}
async function postDiaryDraft(draft){
  const service = await diarySupabaseReady;
  if(service && hasSupabaseSession()){
    const entry = await service.upsertEntryByDate({
      entry_date:draft.date,
      title:draft.title || draft.date,
      body:draft.body,
      body_format:'plain',
      mood:null,
      metadata:{
        source:'pwa_writer',
        saved_at:new Date().toISOString()
      }
    });
    if(entry){
      DIARY_INDEX[draft.date] = {
        title:entry.title || draft.title || draft.date,
        entryUrl:`supabase:${draft.date}`,
        hasPhotos:false,
        source:'supabase',
        supabaseId:entry.id
      };
      ENTRY_CACHE[draft.date] = {
        date:draft.date,
        title:entry.title || draft.title || draft.date,
        body:draft.body,
        photos:[],
        source:'supabase',
        id:entry.id
      };
      renderCalendar();
    }
    return {ok:true, source:'supabase', date:draft.date, id:entry?.id || null};
  }
  const settings = writerApiSettings();
  if(!settings.apiUrl) throw new Error('Worker API URL을 입력해 주세요.');
  if(!settings.writeToken) throw new Error('쓰기 토큰을 입력해 주세요.');
  const res = await fetch(settings.apiUrl, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${settings.writeToken}`
    },
    body:JSON.stringify({
      date:draft.date,
      title:draft.title,
      body:draft.body,
      clientId:'pwa'
    })
  });
  const payload = await res.json().catch(()=>({}));
  if(!res.ok || !payload.ok){
    throw new Error(payload.error || `업로드 실패 (${res.status})`);
  }
  return payload;
}
async function uploadWriterDraft(){
  const draft = getWriterDraft();
  const validation = validateUploadDraft(draft);
  if(validation){
    setWriterStatus(validation);
    return;
  }
  saveWriterDraft('업로드 전 임시 저장했어요.');
  if(!navigator.onLine){
    queueWriterDraft(draft, 'offline');
    setWriterStatus('오프라인이라 전송 대기함에 보관했어요. 온라인일 때 다시 보내기를 눌러 주세요.');
    return;
  }
  setWriterStatus('업로드하고 있어요...');
  try{
    const result = await postDiaryDraft(draft);
    archiveUploadedDraft(draft, result);
    localStorage.removeItem(WRITER_DRAFT_KEY);
    const els = writerEls();
    els.title.value = '';
    els.body.value = '';
    setWriterStatus('업로드 완료. 곧 반영돼요.');
  }catch(e){
    queueWriterDraft(draft, e.message);
    setWriterStatus(`업로드 실패. 글은 전송 대기함에 보관했어요. (${e.message})`);
  }
}
async function retryWriterOutbox(){
  saveWriterSettings();
  let items = readWriterOutbox();
  if(!items.length){
    setWriterStatus('다시 보낼 글이 없어요.');
    return;
  }
  if(!navigator.onLine){
    setWriterStatus('현재 오프라인입니다. 온라인 상태에서 다시 보내 주세요.');
    return;
  }
  setWriterStatus(`전송 대기 글 ${items.length}개를 다시 보내는 중이에요...`);
  const remaining = [];
  let sent = 0;
  for(const item of items){
    try{
      const result = await postDiaryDraft(item.draft);
      archiveUploadedDraft(item.draft, result);
      sent++;
    }catch(e){
      remaining.push({...item, reason:e.message, lastTriedAt:new Date().toISOString()});
    }
  }
  saveWriterOutbox(remaining);
  setWriterStatus(`다시 보내기 완료: 성공 ${sent}개, 남은 글 ${remaining.length}개`);
}
function downloadWriterTxt(){
  const draft = getWriterDraft();
  if(!draft.date){
    setWriterStatus('날짜를 먼저 선택해 주세요.');
    return;
  }
  if(!draft.body.trim()){
    setWriterStatus('본문을 적은 뒤 다운로드해 주세요.');
    return;
  }
  saveWriterDraft('다운로드 전 임시 저장했어요.');
  const blob = new Blob([formatDiaryTxt(draft)], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${draft.date}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1200);
  setWriterStatus('txt 파일을 다운로드했어요. 글은 휴대폰에도 임시 저장되어 있어요.');
}
function openWriter(){
  const els = writerEls();
  els.modal.classList.add('open');
  document.body.style.overflow='hidden';
  restoreWriterSettings();
  updateWriterOutbox();
  if(!restoreWriterDraft(false)){
    els.date.value = todayKey();
    setWriterStatus('새 글을 작성할 수 있어요. 입력 중 자동으로 임시 저장됩니다.');
  }else{
    setWriterStatus('작성 중이던 글을 불러왔어요.');
  }
  setTimeout(()=>els.body.focus(), 120);
}
function closeWriter(){
  saveWriterDraft('닫기 전에 임시 저장했어요.');
  $('#writerModal').classList.remove('open');
  if(!$('#modal').classList.contains('open')) document.body.style.overflow='';
}
let writerAutoSaveTimer = null;
function scheduleWriterAutoSave(){
  clearTimeout(writerAutoSaveTimer);
  writerAutoSaveTimer = setTimeout(()=>saveWriterDraft('자동 저장했어요.'), 500);
}

/* ---------- 데이터 로드 ---------- */
async function loadData(){
  const service = await diarySupabaseReady;
  if(service){
    try{
      DIARY_INDEX = await service.listEntryIndex();
      renderCalendar();
      return;
    }catch(e){
      console.warn('Supabase diary index unavailable; falling back to static data.', e);
    }
  }
  try{
    const res = await fetch(CONFIG.indexUrl, {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    DIARY_INDEX = await res.json();
  }catch(e){
    console.warn('일기 인덱스를 불러오지 못해 예시 데이터를 표시합니다.', e);
    DIARY_INDEX = FALLBACK_INDEX;
  }
  renderCalendar();
}

/* ---------- 시작 ---------- */
function init(){
  $('#headerText').textContent = CONFIG.headerText;
  document.title = CONFIG.headerText;
  applyFont();
  buildSelectors();
  renderDow();
  paintDecorations();
  runIntro();
  diarySupabaseReady = initDiarySupabase();
  loadData();

  $('#prevBtn').addEventListener('click', ()=>{ viewM--; if(viewM<0){viewM=11;viewY--;} renderCalendar(); });
  $('#nextBtn').addEventListener('click', ()=>{ viewM++; if(viewM>11){viewM=0;viewY++;} renderCalendar(); });
  $('#openWriterBtn').addEventListener('click', openWriter);
  $('#writerCloseBtn').addEventListener('click', closeWriter);
  $('#saveDraftBtn').addEventListener('click', ()=>saveWriterDraft());
  $('#uploadDraftBtn').addEventListener('click', uploadWriterDraft);
  $('#downloadDraftBtn').addEventListener('click', downloadWriterTxt);
  $('#retryUploadBtn').addEventListener('click', retryWriterOutbox);
  $('#restoreDraftBtn').addEventListener('click', ()=>restoreWriterDraft(true));
  $('#clearDraftBtn').addEventListener('click', clearWriterDraft);
  $('#authForm').addEventListener('submit', submitAuthForm);
  $('#authCloseBtn').addEventListener('click', closeAuth);
  $('#authSignOutBtn').addEventListener('click', signOutFromAuth);
  ['input','change'].forEach(type=>{
    $('#writerDate').addEventListener(type, scheduleWriterAutoSave);
    $('#writerTitleInput').addEventListener(type, scheduleWriterAutoSave);
    $('#writerBody').addEventListener(type, scheduleWriterAutoSave);
    $('#writerApiUrl').addEventListener(type, ()=>{ saveWriterSettings(); setWriterStatus('업로드 설정을 저장했어요.'); });
    $('#writerToken').addEventListener(type, ()=>{ saveWriterSettings(); setWriterStatus('업로드 설정을 저장했어요.'); });
  });
  window.addEventListener('online', ()=>{ updateWriterOutbox(); setWriterStatus('온라인 상태입니다. 전송 대기 글이 있으면 다시 보내기를 눌러 주세요.'); });
  $('#closeBtn').addEventListener('click', closeDiary);
  $('#fullscreenBtn').addEventListener('click', toggleReadingFullscreen);
  $('#modal').addEventListener('click', e=>{
    if(e.target===$('#modal') && !isReadingFullscreen()) closeDiary();
  });
  $('#writerModal').addEventListener('click', e=>{ if(e.target===$('#writerModal')) closeWriter(); });
  $('#authModal').addEventListener('click', e=>{ if(e.target===$('#authModal')) closeAuth(); });
  window.addEventListener('hashchange', ()=>{ if(window.location.hash==='#auth') openAuth(); });
  if(shouldOpenAuthFromLocation()) setTimeout(openAuth, 0);
  let titleTapCount = 0;
  let titleTapTimer = null;
  $('#headerText').addEventListener('click', ()=>{
    titleTapCount++;
    clearTimeout(titleTapTimer);
    titleTapTimer = setTimeout(()=>{ titleTapCount = 0; }, 1400);
    if(titleTapCount >= 5){
      titleTapCount = 0;
      openAuth();
    }
  });
  $('#fontUp').addEventListener('click', ()=>{ fontScale+=0.12; applyFont(); });
  $('#fontDown').addEventListener('click', ()=>{ fontScale-=0.12; applyFont(); });
  document.addEventListener('fullscreenchange', ()=>{
    if(!getNativeFullscreenElement() && $('#modal').classList.contains('reader-fullscreen')){
      lastNativeFullscreenExitAt = Date.now();
      exitReadingFullscreen({skipNative:true});
    }else{
      updateFullscreenButton();
    }
  });
  document.addEventListener('webkitfullscreenchange', ()=>{
    if(!getNativeFullscreenElement() && $('#modal').classList.contains('reader-fullscreen')){
      lastNativeFullscreenExitAt = Date.now();
      exitReadingFullscreen({skipNative:true});
    }else{
      updateFullscreenButton();
    }
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape' && $('#authModal').classList.contains('open')){
      e.preventDefault();
      closeAuth();
      return;
    }
    if(e.key==='Escape' && $('#writerModal').classList.contains('open')){
      e.preventDefault();
      closeWriter();
      return;
    }
    if(e.key!=='Escape' || !$('#modal').classList.contains('open')) return;
    if(Date.now() - lastNativeFullscreenExitAt < 350){
      e.preventDefault();
      return;
    }
    if(isReadingFullscreen()){
      e.preventDefault();
      exitReadingFullscreen();
    }else{
      closeDiary();
    }
  });
}
document.addEventListener('DOMContentLoaded', init);

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  const host = window.location.hostname;
  const isLocal = host === 'localhost' || host === '127.0.0.1';
  if(window.location.protocol !== 'https:' && !isLocal) return;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js', {scope:'./'})
      .then(()=>console.info('service worker registered'))
      .catch(err=>console.info('service worker registration skipped', err));
  });
}
registerServiceWorker();
</script>
