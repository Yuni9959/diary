name: Diary sync and Pages deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-diary:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync diary static data
        working-directory: Diary_formyWife
        run: python tools/diary_pipeline.py sync

      - name: Commit generated diary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Diary_formyWife/obsidian Diary_formyWife/data Diary_formyWife/inbox
          if git diff --cached --quiet; then
            echo "No generated diary changes to commit."
          else
            git commit -m "Update diary data"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import shutil
          from datetime import datetime, timezone

          root = Path.cwd()
          site = root / "_site"
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()

          for name in ("index.html", "manifest.webmanifest", "sw.js"):
              src = root / name
              if src.exists():
                  shutil.copy2(src, site / name)

          for name in ("icons", "img"):
              src = root / name
              if src.exists():
                  shutil.copytree(src, site / name)

          lib_dest = site / "lib"
          lib_dest.mkdir(parents=True, exist_ok=True)
          for name in ("supabase-client.js", "diary-service.js"):
              src = root / "lib" / name
              if src.exists():
                  shutil.copy2(src, lib_dest / name)

          data_src = root / "Diary_formyWife" / "data"
          data_dest = site / "Diary_formyWife" / "data"
          if data_src.exists():
              data_dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(data_src, data_dest)

          manifest = {
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "has_runtime_config": True,
              "included_files": [
                  "lib/supabase-runtime-config.js",
                  "lib/supabase-client.js",
                  "lib/diary-service.js",
              ],
          }
          (site / "deploy-manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Generate Supabase runtime config into artifact
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          DIARY_RUNTIME_CONFIG_OUTPUT: _site/lib/supabase-runtime-config.js
        run: node tools/write_supabase_runtime_config.mjs

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "_site/index.html"
            "_site/sw.js"
            "_site/lib/supabase-client.js"
            "_site/lib/diary-service.js"
            "_site/lib/supabase-runtime-config.js"
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
          done

          config="_site/lib/supabase-runtime-config.js"
          grep -q "DIARY_SUPABASE_CONFIG" "$config"
          grep -q "enabled" "$config"
          grep -q "url" "$config"
          grep -q "publishableKey" "$config"

          forbidden_patterns=(
            "service_role"
            "DIARY_TEST_PASSWORD"
            "DIARY_TEST_EMAIL"
            "access_token"
            "refresh_token"
            "database password"
            "secret key"
          )

          for pattern in "${forbidden_patterns[@]}"; do
            if grep -qi "$pattern" "$config"; then
              echo "Forbidden runtime config content detected: $pattern"
              exit 1
            fi
          done

          find _site/lib -maxdepth 1 -type f -printf "%p %s bytes\n"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live runtime config
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail

          base="${PAGE_URL%/}"
          url="${base}/lib/supabase-runtime-config.js?run=${GITHUB_RUN_ID}"
          tmp="$(mktemp)"

          for i in $(seq 1 24); do
            if curl -fsS "$url" -o "$tmp" && grep -q "DIARY_SUPABASE_CONFIG" "$tmp"; then
              echo "Live runtime config verified."
              rm -f "$tmp"
              exit 0
            fi
            sleep 5
          done

          echo "Live runtime config verification failed."
          rm -f "$tmp"
          exit 1
