name: Diary sync and Pages deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-diary:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync diary static data
        working-directory: Diary_formyWife
        run: python tools/diary_pipeline.py sync

      - name: Commit generated diary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Diary_formyWife/obsidian Diary_formyWife/data Diary_formyWife/inbox
          if git diff --cached --quiet; then
            echo "No generated diary changes to commit."
          else
            git commit -m "Update diary data"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Generate Supabase runtime config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node tools/write_supabase_runtime_config.mjs

      - name: Build Pages artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          site = root / "_site"
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()

          for name in ("index.html", "manifest.webmanifest", "sw.js"):
              src = root / name
              if src.exists():
                  shutil.copy2(src, site / name)

          for name in ("icons", "img"):
              src = root / name
              if src.exists():
                  shutil.copytree(src, site / name)

          lib_dest = site / "lib"
          lib_dest.mkdir(parents=True, exist_ok=True)
          for name in ("supabase-client.js", "diary-service.js", "supabase-runtime-config.js"):
              src = root / "lib" / name
              if src.exists():
                  shutil.copy2(src, lib_dest / name)

          data_src = root / "Diary_formyWife" / "data"
          data_dest = site / "Diary_formyWife" / "data"
          if data_src.exists():
              data_dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copytree(data_src, data_dest)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
